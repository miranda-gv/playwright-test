
# playwright.yml

# Purpose: Main workflow for running Playwright tests and deploying HTML reports to GitHub Pages.
# Features:
# Runs tests, generates reports, uploads as artifact.
# Deploys reports to gh-pages branch using peaceiris/actions-gh-pages.
# Generates an index page and adds report URLs to the workflow summary.

name: 🎭 Generate Reports Dashboard

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required by actions/deploy-pages@v4
  pages: write      # Required to deploy to GitHub Pages
  actions: read
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  tests:
    name: 🧪 Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report_dir: ${{ steps.report-dir.outputs.name }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: ♻️ Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: ♻️ Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🌐 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Playwright Tests
        run: npx playwright test --project=chromium -g "test-1.spec.ts"
        continue-on-error: true

      - name: 📂 List test-reports directory
        run: ls -R test-reports

      - name: 🖥️ 📑 Install and Publish CTRF Test Summary Results
        run: |
          npm install -g github-actions-ctrf
          github-actions-ctrf test-reports/ctrf-report.json
        if: always()
          
      - name: 🎭 Add Test Summary HTML Table
        if: always()
        run: node .github/scripts/github-test-summary.js

      - name: 📁 Set Report Folder Name
        id: report-dir
        run: |
          REPORT_DIR=$(TZ="America/New_York" date +'%Y-%m-%d_%H-%M-%S')_${{ github.run_id }}
          echo "name=$REPORT_DIR" >> $GITHUB_OUTPUT

      - name: 📤 Package report
        run: |
          mkdir -p package/${{ steps.report-dir.outputs.name }}
          cp -r test-reports/monocart/* package/${{ steps.report-dir.outputs.name }} || echo "No reports to copy"
        env:
            REPORT_DIR: ${{ steps.report-dir.outputs.name }}

      - name: 📦 Upload Report Artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('package/**/*') != ''
        with:
          name: report-folder
          path: package/
          retention-days: 1
          if-no-files-found: warn

  deploy:
    name: 🚀 Deploy Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: tests
    if: needs.tests.outputs.report_dir != ''

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4

      - name: 📥 Checkout existing gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: 🔍 List gh-pages after checkout
        run: ls -R gh-pages

      - name: 📂 Create gh-pages directory if needed
        run: mkdir -p gh-pages

      - name: 📦 Download Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: report-folder
          path: gh-pages
        continue-on-error: true

      - name: 🔍 List gh-pages after checkout
        run: ls -R gh-pages

      - name: 📑 Generate index page
        env:
          REPORT_DIR: ${{ needs.tests.outputs.report_dir }}
        run: node .github/scripts/generate-html.js

      - name: 🔍 List gh-pages after index generation
        run: ls -R gh-pages

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          publish_branch: gh-pages
          enable_jekyll: false
          keep_files: true

      - name: 🔗 Add report URL to summary
        run: |
          echo "## ✅ Test Report Available" >> $GITHUB_STEP_SUMMARY
          echo "[Open Latest Report 🔍](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.tests.outputs.report_dir }}/)" >> $GITHUB_STEP_SUMMARY
          echo "[View All Reports](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY
