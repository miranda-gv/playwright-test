# playwright.yml
# Optimized version of the Playwright test workflow

name: 🎭 Run Playwright Tests

on:
  # push:
  #   branches: '*'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Select a Report type'
        required: true
        default: 'playwright-report'
        type: choice
        options:
          - monocart
          - playwright-report

permissions:
  contents: write
  id-token: write
  pages: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: 🧪 Run Playwright Tests
    # Use the official Playwright container to save time on setup and ensure consistency with local development
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble # Match @playwright/test version from package.json
    timeout-minutes: 10
    env:
      REPORT_TYPE: ${{ github.event.inputs.report_type || 'monocart' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # Integrated caching for faster setup

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🧹 Lint Check
        run: npm run lint # Fail early if code style or syntax is broken

      - name: 🧪 Run Playwright Tests
        run: npx playwright test tests/playwright/test-1.spec.ts --project=chromium

      - name: 🖥️ 📑 Publish CTRF Summary
        if: always()
        run: npx github-actions-ctrf test-reports/ctrf-report.json

      - name: 📊 Add Test Summary HTML Table
        if: always()
        run: node .github/dashboard-scripts/lib/step-summary-table.js

      - name: 📁 Set Report Folder Name
        if: always()
        id: report-dir
        run: |
          REPORT_DIR=$(TZ="America/New_York" date +'%Y-%m-%d_%H-%M-%S')_${{ github.run_id }}
          echo "name=$REPORT_DIR" >> $GITHUB_OUTPUT

      - name: 📤 Package & Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-folder
          # Directly target the report directory structure
          path: |
            test-reports/${{ env.REPORT_TYPE }}
          retention-days: 30

      - name: 🔗 Add Dashboard URL
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 The new report will be available here after a few minutes: https://miranda-gv.github.io/playwright-test/" >> $GITHUB_STEP_SUMMARY
