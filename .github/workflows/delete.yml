
# This workflow is designed to clean up the GitHub Pages content by deleting
# all files in the `gh-pages` branch except for the `.git` directory. 
# It can be triggered manually via the "Run workflow" button in the GitHub Actions tab.
# The workflow checks out the `gh-pages` branch, removes all files, commits the changes, 
# and pushes them back to the repository. 
# Make sure to set up a Personal Access Token (PAT) with appropriate permissions and 
# add it as a secret named `GH_PAT` in your repository settings before using this workflow.



name: 🗑️ Cleanup GitHub Pages Content

on:
  workflow_dispatch:

jobs:
  cleanup-gh-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GH_PAT }}

      - name: Remove all files except .git
        run: |
          shopt -s extglob
          rm -rf !(.git)

      - name: Commit and push cleanup
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Clean up GitHub Pages content" || echo "Nothing to commit"
          git push https://x-access-token:${GH_PAT}@github.com/${{ github.repository }} gh-pages
          